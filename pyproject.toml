[project]
name = "raccoonlabs"
version = "0.1.0"
description = "A research lab in Slack for student research groups, built on Switch."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
labrun = "labrun:main"
lab-search = "lab_search:main_cli"
lab-paper = "lab_paper:main_cli"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["tools/labrun", "tools/lab_search", "tools/lab_paper"]
only-include = ["tools/labrun/labrun.py", "tools/lab_search/lab_search.py", "tools/lab_paper/lab_paper.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools/lab_search", "tools/lab_paper"]

[tool.hatch.build]
dev-mode-dirs = ["tools/labrun", "tools/lab_search", "tools/lab_paper"]
