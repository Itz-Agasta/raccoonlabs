[project]
name = "raccoonlabs"
version = "0.1.0"
description = "A research lab in Slack for student research groups, built on Switch."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
labrun = "labrun:main"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["tools/labrun"]
only-include = ["tools/labrun/labrun.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
dev-mode-dirs = ["tools/labrun"]
